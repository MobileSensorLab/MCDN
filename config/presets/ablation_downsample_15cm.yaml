# Controlled resolution-degradation preset. Keeps the native sUAS chip inventory
# (sensor_profile stays uas_5cm, so train/val samples, instances, and class balance are
# identical to baseline) and synthetically degrades RGB to 15 cm-equivalent GSD via
# anti-aliased 3x downsample + upsample back to the 512 px grid. Unlike the crewed-aircraft
# arm, this isolates resolution from acquisition confounds and covers Mayfield.
data:
  dir: "data/"
  chip_size: 512
  holdout_event: null
  sensor_profile: "uas_5cm"
  synthetic_gsd_factor: 3.0

training:
  epochs: 100
  batch_size: 64
  accum_steps: 2
  lr: 1e-4
  sampler_mode: "uniform"
  class_weighting_enabled: true
  class_weighting_power: 0.4
  lr_plateau_patience: 4
  label_smoothing: 0.02
  max_grad_norm: 1.0

model:
  name: "convnextv2_nano.fcmae_ft_in22k_in1k"
  pretrained: true
  drop_path_rate: 0.10

ablation:
  mask_enabled: true
  typology_enabled: true
  mask_weighted_pooling_enabled: true
  mask_dilation_px: 0

runtime:
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 3
  drop_last: true
  val_batch_size_factor: 0.5
  device: "auto"
  seed: null
  early_stopping_patience: 10
  ema_enabled: true
  ema_decay: 0.996
  lr_drop_warmstart_from_best: true
  reset_optimizer_on_lr_drop: false
  checkpoint_root: "outputs/checkpoints"
