# Crewed-GSD resolution-degradation preset (29 Aug; its 20 runs replaced the queued
# MTF arm's manifest rows 311-330 before any had started). Calibration: the published
# crewed pool measures 25.1 cm building-weighted mean GSD (median 25.0, range 15-30;
# statistics.csv), while the sUAS pool is 3.4-3.7 cm native — so the paper's
# crewed-vs-sUAS contrast is ~7.4x linear, not the nominal 3x, and the downsample_15cm
# arm (~10 cm median effective) never reaches the crewed pool's floor. Factor 7.0 on
# native sUAS grids yields ~14-33 cm effective (median ~23 cm), reproducing the crewed
# pool's center and spread. Spectral validation against five overlapping Hurricane Ian
# crewed sorties (outputs/gsd_validation_7x/, factors 5.1-9.3) measured this pipeline's
# transfer at 0.36-0.37 at the crewed Nyquist vs 0.39-0.55 for the real 25-30 cm
# sensors on trustworthy pairs — the arm tracks the real product, erring slightly
# conservative. Chip inventory, instances, and class balance stay identical to baseline.
data:
  dir: "data/"
  chip_size: 512
  holdout_event: null
  sensor_profile: "uas_5cm"
  synthetic_gsd_factor: 7.0

training:
  epochs: 100
  batch_size: 64
  accum_steps: 2
  lr: 1e-4
  sampler_mode: "uniform"
  class_weighting_enabled: true
  class_weighting_power: 0.4
  lr_plateau_patience: 4
  label_smoothing: 0.02
  max_grad_norm: 1.0

model:
  name: "convnextv2_nano.fcmae_ft_in22k_in1k"
  pretrained: true
  drop_path_rate: 0.10

ablation:
  mask_enabled: true
  typology_enabled: true
  mask_weighted_pooling_enabled: true
  mask_dilation_px: 0

runtime:
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 3
  drop_last: true
  val_batch_size_factor: 0.5
  device: "auto"
  seed: null
  early_stopping_patience: 10
  ema_enabled: true
  ema_decay: 0.996
  lr_drop_warmstart_from_best: true
  reset_optimizer_on_lr_drop: false
  checkpoint_root: "outputs/checkpoints"
